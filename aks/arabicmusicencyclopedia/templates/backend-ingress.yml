apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ame-backend-ingress
  namespace: arabicmusicencyclopedia
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/override-frontend-port: "8080"
    appgw.ingress.kubernetes.io/health-probe-path: "/articles?title=Main"
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080