apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
  namespace: arabicmusicencyclopedia
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - env:
          image: nginx:latest
          name: frontend
          volumeMounts:
            - name: app-files
              mountPath: /usr/share/nginx/html
              readOnly: true
              subPath: frontend
      volumes:
        - name: app-files
          persistentVolumeClaim:
            claimName: app-arabicmusicencyclopedia-pvc